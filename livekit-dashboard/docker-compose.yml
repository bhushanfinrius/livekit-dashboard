services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: deck
      POSTGRES_PASSWORD: deck
      POSTGRES_DB: deck
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deck -d deck"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  livekit:
    image: livekit/livekit-server:latest
    command: --config /etc/livekit.yaml --bind 0.0.0.0
    restart: unless-stopped
    ports:
      - "7880:7880"
      - "7881:7881"
      - "50000-50100:50000-50100/udp"
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy

  sip:
    image: livekit/sip:latest
    command: --config /etc/sip.yaml
    restart: unless-stopped
    volumes:
      - ./sip.yaml:/etc/sip.yaml
    ports:
      - "5060:5060/udp"
      - "5060:5060/tcp"
      - "10000-10050:10000-10050/udp"
      - "8088:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
      livekit:
        condition: service_started

  egress:
    image: livekit/egress:latest
    restart: unless-stopped
    environment:
      EGRESS_CONFIG_FILE: /etc/egress.yaml
    volumes:
      - ./egress.yaml:/etc/egress.yaml
    extra_hosts:
      - "host.docker.internal:host-gateway"
    security_opt:
      - seccomp:unconfined
    depends_on:
      redis:
        condition: service_healthy
      livekit:
        condition: service_started

  # Started from Deck (Agents → Deploy) or `docker compose --profile agent up -d agent`.
  # Build context is the official starter clone (AGENT_BUILD_CONTEXT).
  agent:
    profiles: ["agent"]
    build:
      context: ${AGENT_BUILD_CONTEXT:-../agent-starter-python}
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - path: .agent.runtime.env
        required: false
    environment:
      LIVEKIT_URL: ws://livekit:7880
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      livekit:
        condition: service_started

  deck:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://deck:deck@postgres:5432/deck
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      AUTH_SECRET: ${AUTH_SECRET:-deck-dev-secret-replace-before-production-use-32b}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-deck-dev-encryption-key-replace-before-prod32}
      # Server-side SDK calls the Compose service. The browser still uses 127.0.0.1:7880.
      LIVEKIT_INTERNAL_URL: http://livekit:7880
      DECK_IN_COMPOSE: "1"
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    volumes:
      - ./livekit.yaml:/app/livekit.yaml:ro
    ports:
      - "3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      livekit:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s

volumes:
  postgres-data:
