# Production / India VPS LiveKit config.
#
# Preferred: set LIVEKIT_PUBLIC_IP in .env and run:
#   npm run docker:vps:up
# (generates config/livekit.runtime.yaml from config/livekit.vps.yaml.template)
#
# Legacy manual copy:
#   cp livekit.vps.example.yaml livekit.yaml
#   docker compose -f docker-compose.yml -f docker-compose.vps.yml up -d --force-recreate livekit sip egress

port: 7880
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50100
  use_external_ip: true

# Built-in TURN — required for many India mobile / office NATs (Cloud parity).
# Set domain to your public IP or DNS name (e.g. livekit.yourdomain.com or 1.2.3.4).
turn:
  enabled: true
  domain: YOUR_PUBLIC_IP_OR_HOSTNAME
  udp_port: 3478

redis:
  address: redis:6379

keys:
  # Generated by `npm run livekit:keys`: one infra pair plus a pool assigned one-per-project.
  # LiveKit 1.13+ requires API secrets >= 32 characters.
  __LIVEKIT_KEYS__

webhook:
  api_key: __LIVEKIT_INFRA_API_KEY__
  urls:
    - http://host.docker.internal:3000/api/webhooks/livekit
    - http://deck:3000/api/webhooks/livekit
